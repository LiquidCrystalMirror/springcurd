# application-redis.yml
redis:
  redisson:
    config: |
      singleServerConfig:
        address: "redis://127.0.0.1:6379"
        database: 0
        connectionPoolSize: 64
      codec: !<org.redisson.codec.JsonJacksonCodec> {}

# 新增库存脚本相关配置
stock:
  script:
    timeout: 300  # 脚本执行默认超时时间（秒）
    path:
      batch-operation: lua/batch_deduct.lua
      rollback: lua/rollback.lua
      query: lua/query.lua
      cancel: lua/cancel.lua
      replenish: lua/replenish.lua
    type:
      deduct: deduct
      add: add
  queue:
    batch-size: 100
    deduct-queue: async:queue:deduct
    add-queue: async:queue:add
    rollback-queue: async:queue:rollback
  retry:
    max-attempts: 3  # 最大重试次数
    base-interval: 100  # 基础重试间隔（毫秒），实际间隔 = base-interval * (retry + 1)