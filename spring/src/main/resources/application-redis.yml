# application-redis.yml
redis:
  # 独立 Redis 连接属性（支持 .env 覆盖）
  address: ${REDIS_ADDRESS:redis://127.0.0.1:6379}
  database: ${REDIS_DATABASE:0}
  pool-size: ${REDIS_POOL_SIZE:64}
  redisson:
    # 完整 Redisson YAML 配置（兜底方案，内部占位符不会由 Spring 解析）
    # 优先使用上面独立属性，仅当独立属性全为空时才回退到此配置
    config: |
      singleServerConfig:
        address: "redis://127.0.0.1:6379"
        database: 0
        connectionPoolSize: 64
      codec: !<org.redisson.codec.JsonJacksonCodec> {}

# 新增库存脚本相关配置
stock:
  script:
    timeout: 300  # 脚本执行默认超时时间（秒）
    path:
      batch-operation: lua/batch_deduct.lua
      rollback: lua/rollback.lua
      query: lua/query.lua
      cancel: lua/cancel.lua
      replenish: lua/replenish.lua
    type:
      deduct: deduct
      add: add
  retry:
    max-attempts: 3  # 最大重试次数
    base-interval: 100  # 基础重试间隔（毫秒），实际间隔 = base-interval * (retry + 1)