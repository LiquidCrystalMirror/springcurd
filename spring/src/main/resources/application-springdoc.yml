
# SpringDoc OpenAPI 配置
springdoc:
  # API文档路径
  api-docs:
    path: /v3/api-docs
    enabled: true
  # Swagger UI 配置
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    # 按接口路径排序
    operations-sorter: method
    # 按标签排序
    tags-sorter: alpha
    # 默认展开所有接口
    doc-expansion: none
    # 显示请求持续时间
    display-request-duration: true
  # 自动扫描所有带有 @Operation 的方法
  show-actuator: false
  # 自动扫描所有带有 @RestController 的类
  use-fqn: true